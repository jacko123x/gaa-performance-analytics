# Alembic configuration for GAA Analytics

[alembic]

# Location of migration scripts
script_location = %(here)s/migrations

# Add the project root to Python's import path.
# This allows Alembic to import src.database.*
prepend_sys_path = .

# Use the operating system's path separator
path_separator = os

# Encoding used when Alembic generates migration files
output_encoding = utf-8

# -------------------------------------------------------------------
# Database URL
# -------------------------------------------------------------------
#
# The real DATABASE_URL is NOT stored here.
#
# migrations/env.py loads DATABASE_URL from the project's .env file
# and overrides this value at runtime.
#
# Keeping the real credentials out of this file prevents them from
# accidentally being committed to Git.
#
sqlalchemy.url = postgresql+psycopg://placeholder


# -------------------------------------------------------------------
# Post-write hooks
# -------------------------------------------------------------------

[post_write_hooks]

# No automatic formatting/linting configured yet.
#
# These can be enabled later if we add Black or Ruff.


# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
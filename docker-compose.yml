services:
  postgres:
    image: postgres:16
    container_name: gaa-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gaa_analytics
      POSTGRES_USER: gaa_admin
      POSTGRES_PASSWORD: gaa_local_password

    ports:
      - "5432:5432"

    volumes:
      - gaa_postgres_data:/var/lib/postgresql/data

volumes:
  gaa_postgres_data: